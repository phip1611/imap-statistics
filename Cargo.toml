[package]
name = "imap-statistics"
description = """
CLI to fetch the headers of all emails from IMAP accounts and generate a
Markdown report with statistics: emails per year, per category, and per
sender.
"""
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
keywords = ["imap", "email", "statistics", "report", "cli"]
categories = ["command-line-utilities", "email"]
readme = "README.md"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/phip1611/imap-statistics"
repository = "https://github.com/phip1611/imap-statistics"
authors = [
  "Philipp Schuster <phip1611@gmail.com>"
]

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
clap = { version = "4.6", default-features = false, features = [
  "color",
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "unicode",
  "usage",
  "wrap_help",
] }
mailparse = { version = "0.18", default-features = false }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-native-certs = "0.8"
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0", default-features = false, features = [
  "std",
] }
toml = { version = "1.1", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }

[lints.rust]
missing_debug_implementations = "deny"

[lints.rustdoc]
all = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
absolute_paths = "deny"
must_use_candidate = "deny"
# Too noisy for little gain.
fallible_impl_from = "allow"
redundant_pub_crate = "allow"
suboptimal_flops = "allow"
# Caused by dependencies, nothing to do about it here.
multiple_crate_versions = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
