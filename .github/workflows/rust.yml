name: Build

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ macos-latest, ubuntu-latest, windows-latest ]
        # Specific version: MSRV
        rust: [ 1.88.0, stable, nightly ]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.rust }}
      - name: cargo build (debug)
        run: cargo build --locked --all-targets
      - name: cargo build (release)
        run: cargo build --locked --release
      - name: cargo test
        run: cargo test --locked --all-targets
      # Test that we don't segfault or so because of the LTO.
      - name: "CLI [release]: imap-statistics --help"
        run: cargo run --locked --release -- --help

  # Generates the demo report on every OS and compares it with the
  # committed one, so that it stays up to date and the output is the same
  # everywhere.
  demo_report:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ macos-latest, ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
          save-if: false
      - name: Generate the demo report
        run: examples/demo/generate.sh
      - name: Check that the committed demo report is up to date
        run: |
          changes=$(git status --porcelain -- examples/demo/report)
          if [ -n "$changes" ]; then
              echo "$changes"
              echo "The demo report is outdated, run examples/demo/generate.sh" >&2
              exit 1
          fi

  style_checks:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --document-private-items --no-deps
