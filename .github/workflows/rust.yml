name: Build

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ macos-latest, ubuntu-latest, windows-latest ]
        # Specific version: MSRV
        rust: [ 1.85.1, stable, nightly ]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.rust }}
      - name: cargo build (debug)
        run: cargo build --locked --all-targets
      - name: cargo build (release)
        run: cargo build --locked --release
      - name: cargo test
        run: cargo test --locked --all-targets
      # Test that we don't segfault or so because of the LTO.
      - name: "CLI [release]: imap-statistics --help"
        run: cargo run --locked --release -- --help

  style_checks:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --document-private-items --no-deps
